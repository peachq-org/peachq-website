# The inherited reference remains available through the reference landing page.
not_in_nav: |
  docs/basics/*.md
  docs/ref/*.md

extra:
  # The site menu, rendered inline by overrides/partials/header.html. It mirrors
  # the $nav array in static/template.php exactly, in the same order, so moving
  # between the PHP root pages and this section does not change the menu.
  #
  # URLs are relative to the site root, and the header prefixes each with
  # Material's per-page base_url. Neither absolute (which would send anyone on a
  # local build or a staging host off to production) nor root-relative (which
  # would break the copy installed at timestored.com/peachq). They live under
  # `extra` rather than `nav` because MkDocs tries to resolve `nav` entries as
  # documents.
  #
  # Keep in sync with static/template.php; tests/test_pages.sh checks this.
  peachq_nav:
    - title: Try Live
      url: repl
    - title: Download
      url: download
    - title: Docs
      url: docs/
    - title: Compatibility
      url: compatibility
    - title: News
      url: news/
    - title: About
      url: about
  peachq_footer_nav:
    - title: Try Live
      url: repl
    - title: Download
      url: download
    - title: Docs
      url: docs/
    - title: Compatibility
      url: compatibility
    - title: Roadmap
      url: roadmap
    - title: News
      url: news/
    - title: About
      url: about
    - title: Contact
      url: contact

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: [content]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
